<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f3b"><title>로그인 · 업무인수인계 바통터치</title><style>/* LOGIN_STYLE */</style></head><body><main class="login-layout" id="login-screen"><section class="login-panel"><div id="login-view"><h2 id="auth-title">바통터치 로그인</h2><p id="auth-description" hidden></p><form id="auth-form"><label>새올 ID <small id="login-id-help" hidden></small><input id="auth-username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="2" maxlength="80" placeholder="본인의 새올 아이디(SAEOLL_ID)"></label><label>비밀번호<input id="auth-password" type="password" autocomplete="current-password" maxlength="200" placeholder="바통터치 비밀번호"></label><label id="bootstrap-field" hidden>초기 관리자 등록 토큰<input id="bootstrap-token" type="password" autocomplete="off" maxlength="200"></label><button class="primary" id="auth-submit" type="submit">로그인</button></form><button id="show-reset" type="button" hidden></button></div><button id="show-activation" type="button" hidden></button><div id="activation-view" hidden><h2>최초 비밀번호 설정</h2><p id="first-password-notice" role="status">본인확인 연결 상태를 확인하고 있습니다.</p><form id="self-password-form"><label>새올 ID<input id="self-username" required autocomplete="username" autocapitalize="none" maxlength="80"></label><button id="self-code-request" class="secondary" type="button">본인확인 인증번호 받기</button><label>인증번호<input id="self-code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"></label><label>새 비밀번호<input id="self-password" type="password" required minlength="12" maxlength="200" autocomplete="new-password"></label><label>새 비밀번호 확인<input id="self-confirmation" type="password" required minlength="12" maxlength="200" autocomplete="new-password"></label><p class="hint">문자·숫자·기호를 포함한 12자 이상</p><button id="self-password-submit" class="primary">비밀번호 설정하고 시작하기</button></form><button id="first-password-cancel" class="secondary" type="button">로그인으로 돌아가기</button></div><div id="password-view" hidden><span class="badge">계정 보호</span><h2>비밀번호 변경</h2><p id="password-description">임시 비밀번호를 본인만 아는 비밀번호로 변경한 뒤 업무를 시작하세요.</p><form id="password-form"><label>현재 또는 임시 비밀번호<input id="current-password" type="password" autocomplete="current-password" required maxlength="200"></label><label>새 비밀번호<input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label><label>새 비밀번호 확인<input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label><p class="hint">문자·숫자·기호를 포함한 12자 이상. 현재 비밀번호와 다르게 설정하세요.</p><button class="primary" id="password-submit">변경하고 시작하기</button><button class="secondary" id="password-logout" type="button">로그아웃</button></form></div><div id="reset-view" hidden><span class="badge">관리자 승인</span><h2>비밀번호 초기화 요청</h2><p>요청 후 관리자가 본인 여부를 확인하고 승인해야 합니다. 비밀번호가 자동 변경되지는 않습니다.</p><form id="reset-form"><label>로그인 아이디<input id="reset-username" autocomplete="username" required minlength="2" maxlength="80"></label><button class="primary" id="reset-submit">관리자에게 초기화 요청</button><button class="secondary" id="reset-cancel" type="button">로그인으로 돌아가기</button></form></div><p id="auth-message" class="message" role="status" aria-live="polite" hidden></p></section></main><script>/* LOGIN_SCRIPT */</script></body></html>
