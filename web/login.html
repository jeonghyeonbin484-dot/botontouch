<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f3b"><title>로그인 · 업무인수인계 바통터치</title><style>:root{font-family:"Malgun Gothic",system-ui,sans-serif;color:#203333;background:#f6f8f7;font-size:14px;line-height:1.7}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}[hidden]{display:none!important}.login-layout{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;max-width:1400px;margin:auto}.login-intro{background:#123f3a;color:#f2f8f4;padding:70px 65px;display:flex;flex-direction:column;justify-content:center}.brand{display:flex;gap:14px;align-items:center;font-size:28px;margin-bottom:55px}.brand-symbol{position:relative;display:block;flex-shrink:0;width:34px;height:37px;transform:rotate(-34deg)}.brand-symbol i{position:absolute;display:block;width:12px;height:28px;border-radius:7px;background:#aed8c1;top:0;left:3px}.brand-symbol i+i{left:19px;top:9px;background:#f0f6de}.eyebrow{font-size:12px;color:#bdd4c7;letter-spacing:.08em}.login-intro h1{font-size:40px;line-height:1.4;margin:8px 0 22px;letter-spacing:-.05em}.login-intro>p{color:#bed5c9}.login-intro ol{padding-left:20px;margin-top:38px;color:#bfd6c7}.login-intro li{padding:6px 0}.login-panel{padding:70px;display:flex;flex-direction:column;justify-content:center;min-width:0}.badge{font-size:11px;background:#e8f2eb;color:#1a6154;border-radius:6px;padding:5px 9px}h2{font-size:25px;margin:18px 0 10px;letter-spacing:-.04em}p{color:#64766a}form{margin-top:26px}label{display:block;margin:19px 0 8px;font-weight:600;font-size:13px}label small{font-size:11px;color:#728476;font-weight:400;margin-left:6px}input{display:block;width:100%;border:1px solid #d5e2d9;background:#fff;border-radius:8px;padding:13px 14px;min-height:48px;margin-top:9px;color:#203333}input:focus{outline:3px solid #a0c8b3;outline-offset:1px}.primary,.secondary{display:block;width:100%;min-height:46px;border-radius:8px;padding:11px 16px;margin-top:20px;font-weight:600}.primary{border:1px solid #1a6154;background:#1a6154;color:#fff}.primary:hover{background:#124b41}.secondary{border:1px solid #d5e2d9;background:#fff;color:#1a6154}.text-button{background:none;color:#1a6154;border:0;padding:0;text-decoration:underline;text-underline-offset:4px}.login-help{border-top:1px solid #e1e8e2;margin-top:28px;padding-top:21px;font-size:12px}.login-help p{margin:7px 0 14px}.hint,.privacy{font-size:12px}.privacy{margin-top:30px;color:#7a897e}.message{padding:13px 15px;background:#edf5f0;color:#174d3e;border-radius:8px;overflow-wrap:anywhere;font-size:13px}.message.error{background:#fff0ed;color:#a13d32}.hint{margin-top:12px}@media(max-width:850px){.login-panel{padding:40px}.login-intro{padding:45px 35px}.login-intro h1{font-size:32px}}@media(max-width:600px){.login-layout{grid-template-columns:1fr}.login-intro{padding:25px 24px}.brand{font-size:23px;margin:0}.login-intro h1{font-size:25px;margin:10px 0}.login-intro .eyebrow,.login-intro ol,.login-intro>p:not(.eyebrow){display:none}.login-panel{padding:30px 24px}.privacy{margin-bottom:0}}

/* 직원 로그인은 입력과 두 진입 링크만 표시한다. */
.login-layout{display:block;min-height:0;max-width:480px;margin:clamp(24px,8vh,96px) auto;padding:16px}.login-panel{padding:36px;border-radius:18px}.login-panel h2{margin-top:0}.login-help{border-top:0;margin-top:18px;padding-top:0}#show-activation{display:block;margin-top:12px}@media(max-width:520px){.login-panel{padding:24px}.login-layout{margin:20px auto}}
</style></head><body><main class="login-layout" id="login-screen"><section class="login-panel"><div id="login-view"><h2 id="auth-title">바통터치 로그인</h2><p id="auth-description" hidden></p><form id="auth-form"><label>새올 ID <small id="login-id-help" hidden></small><input id="auth-username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="2" maxlength="80" placeholder="본인의 새올 아이디(SAEOLL_ID)"></label><label>비밀번호<input id="auth-password" type="password" autocomplete="current-password" maxlength="200" placeholder="바통터치 비밀번호"></label><label id="bootstrap-field" hidden>초기 관리자 등록 토큰<input id="bootstrap-token" type="password" autocomplete="off" maxlength="200"></label><button class="primary" id="auth-submit" type="submit">로그인</button></form><button id="show-reset" type="button" hidden></button></div><button id="show-activation" type="button" hidden></button><div id="activation-view" hidden><h2>최초 비밀번호 설정</h2><form id="self-password-form"><label>새올 ID<input id="self-username" required autocomplete="username" autocapitalize="none" maxlength="80"></label><label>새 비밀번호<input id="self-password" type="password" required minlength="12" maxlength="200" autocomplete="new-password"></label><label>새 비밀번호 확인<input id="self-confirmation" type="password" required minlength="12" maxlength="200" autocomplete="new-password"></label><button id="self-password-submit" class="primary" disabled>비밀번호 설정</button></form><button id="first-password-cancel" class="secondary" type="button">로그인으로 돌아가기</button></div><div id="password-view" hidden><span class="badge">계정 보호</span><h2>비밀번호 변경</h2><p id="password-description">임시 비밀번호를 본인만 아는 비밀번호로 변경한 뒤 업무를 시작하세요.</p><form id="password-form"><label>현재 또는 임시 비밀번호<input id="current-password" type="password" autocomplete="current-password" required maxlength="200"></label><label>새 비밀번호<input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label><label>새 비밀번호 확인<input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required></label><p class="hint">문자·숫자·기호를 포함한 12자 이상. 현재 비밀번호와 다르게 설정하세요.</p><button class="primary" id="password-submit">변경하고 시작하기</button><button class="secondary" id="password-logout" type="button">로그아웃</button></form></div><div id="reset-view" hidden><span class="badge">관리자 승인</span><h2>비밀번호 초기화 요청</h2><p>요청 후 관리자가 본인 여부를 확인하고 승인해야 합니다. 비밀번호가 자동 변경되지는 않습니다.</p><form id="reset-form"><label>로그인 아이디<input id="reset-username" autocomplete="username" required minlength="2" maxlength="80"></label><button class="primary" id="reset-submit">관리자에게 초기화 요청</button><button class="secondary" id="reset-cancel" type="button">로그인으로 돌아가기</button></form></div><p id="auth-message" class="message" role="status" aria-live="polite" hidden></p></section></main><script>'use strict';
const $=id=>document.getElementById(id);let setup=false,requesting=false,firstOptionsPending=null,sessionPasswordAllowed=false;
function show(view){for(const name of ['login','password','reset','activation'])$(name+'-view').hidden=name!==view;$('auth-message').hidden=true;$('show-activation').hidden=true;if(view==='activation')void loadFirstPasswordOptions();}
function message(text,error=false){$('auth-message').textContent=text;$('auth-message').className='message'+(error?' error':'');$('auth-message').hidden=false;}
const AUTH_TIMEOUT_MS=20000;
async function api(path,body){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),AUTH_TIMEOUT_MS);try{const response=await fetch(path,{signal:controller.signal,credentials:'same-origin',cache:'no-store',...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});let data;try{data=await response.json();}catch(e){if(controller.signal.aborted)throw e;throw Error('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도하세요.');}if(!response.ok){const error=Error(data.error||'요청을 처리하지 못했습니다.');error.status=response.status;throw error;}return data;}catch(e){if(controller.signal.aborted)throw Error('서버 응답 시간이 초과되었습니다. 입력은 유지됩니다. 로그인 상태와 설정 결과를 확인한 후 다시 시도하세요.');throw e;}finally{clearTimeout(timer);}}
function refreshPasswordButton(){$('self-password-submit').disabled=requesting||!sessionPasswordAllowed;}
async function job(button,work){if(requesting)return;requesting=true;const node=$(button),label=node.textContent;node.disabled=true;node.textContent='처리 중…';message('처리 중입니다. 잠시만 기다려 주세요.');try{await work();}catch(e){if(button==='self-password-submit'&&(e.status===401||e.status===403))sessionPasswordAllowed=false;message(e.message||'서버에 연결할 수 없습니다.',true);}finally{requesting=false;node.textContent=label;node.disabled=false;refreshPasswordButton();}}
async function initialize(){try{const state=await api('/api/auth/status');setup=state.setup_required===true;if(state.user){if(state.user.must_change_password){$('self-username').value=state.user.username;show('activation');}else if(location.hash==='#password'){show('password');$('password-description').textContent=state.user.must_change_password?'비밀번호 변경 전에는 다른 기능을 사용할 수 없습니다.':'현재 비밀번호를 확인하고 새 비밀번호를 설정하세요.';}else location.replace('/');return;}show(!setup&&location.hash==='#activate'?'activation':'login');$('bootstrap-field').hidden=!setup||!state.bootstrap_token_required;$('bootstrap-token').required=setup&&state.bootstrap_token_required;if(setup){$('auth-description').hidden=false;$('login-id-help').textContent='초기 시스템 관리자 ID';$('auth-title').textContent='초기 관리자 등록';$('auth-description').textContent='직원 계정을 발급할 관리자를 먼저 등록하세요. 초기 시스템 관리용이며, 문자·숫자·기호를 포함한 12자 이상 비밀번호를 설정하세요.';$('auth-submit').textContent='관리자 등록하고 시작하기';$('auth-password').required=true;$('auth-password').minLength=12;$('auth-password').autocomplete='new-password';}else if(new URLSearchParams(location.search).get('reason')==='expired')message('로그인이 만료되었거나 계정이 변경되었습니다. 다시 로그인하세요.');else if(new URLSearchParams(location.search).get('reason')==='password-set')message('비밀번호 설정을 완료했습니다. 새 비밀번호로 로그인하세요.');else if(new URLSearchParams(location.search).get('reason')==='logout')message('로그아웃되었습니다.');}catch(e){message('서버 연결을 확인하세요. '+e.message,true);}}
$('auth-form').onsubmit=e=>{e.preventDefault();void job('auth-submit',async()=>{if(!setup&&!$('auth-password').value){throw Error('아이디와 비밀번호를 입력하세요.');}const result=await api('/api/auth/'+(setup?'setup':'login'),{username:$('auth-username').value.trim(),password:$('auth-password').value,...(setup?{bootstrap_token:$('bootstrap-token').value}:{})});$('auth-password').value='';$('bootstrap-token').value='';if(result.user.must_change_password){$('self-username').value=result.user.username;show('activation');location.hash='activate';}else location.replace('/');});};
$('password-form').onsubmit=e=>{e.preventDefault();void job('password-submit',async()=>{await api('/api/auth/password',{current_password:$('current-password').value,new_password:$('new-password').value,confirmation:$('confirm-password').value});for(const id of ['current-password','new-password','confirm-password'])$(id).value='';location.replace('/');});};
$('password-logout').onclick=()=>void job('password-submit',async()=>{await api('/api/auth/logout',{});location.replace('/login?reason=logout');});
$('show-reset').onclick=()=>{show('reset');$('reset-username').value=$('auth-username').value;};$('reset-cancel').onclick=()=>show('login');
$('reset-form').onsubmit=e=>{e.preventDefault();void job('reset-submit',async()=>{const result=await api('/api/auth/reset-request',{username:$('reset-username').value.trim()});message(result.message);});};
window.addEventListener('pageshow',e=>{if(e.persisted)void initialize();});void initialize();

$('show-activation').onclick=()=>{location.hash='activate';show('activation');$('self-username').value=$('auth-username').value.toLowerCase();};
$('auth-username').addEventListener('input',e=>{e.target.value=e.target.value.toLowerCase();});

async function loadFirstPasswordOptions(){if(firstOptionsPending)return firstOptionsPending;sessionPasswordAllowed=false;refreshPasswordButton();firstOptionsPending=(async()=>{try{const options=await api('/api/auth/session-password/options');sessionPasswordAllowed=options.allowed===true;$('self-username').readOnly=sessionPasswordAllowed;if(sessionPasswordAllowed){$('self-username').value=options.username;message('로그인 확인이 완료되었습니다. 새 비밀번호를 설정하세요.');}else message('로그인 인증이 완료되지 않았습니다. 로그인으로 돌아가 현재 또는 개별 발급된 임시 비밀번호로 로그인하세요.',true);}catch(e){sessionPasswordAllowed=false;message(e.message,true);}finally{firstOptionsPending=null;refreshPasswordButton();}})();return firstOptionsPending;}
$('self-password-form').onsubmit=e=>{e.preventDefault();if(!sessionPasswordAllowed){message('로그인 인증이 필요합니다. 로그인으로 돌아가 주세요.',true);refreshPasswordButton();return;}void job('self-password-submit',async()=>{await api('/api/auth/session-password',{username:$('self-username').value.trim().toLowerCase(),new_password:$('self-password').value,confirmation:$('self-confirmation').value});for(const id of ['self-password','self-confirmation'])$(id).value='';location.replace('/login?reason=password-set');});};
$('first-password-cancel').onclick=()=>{location.hash='';show('login');};
$('self-username').oninput=e=>{e.target.value=e.target.value.toLowerCase();};
</script></body></html>
